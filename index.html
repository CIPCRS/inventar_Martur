<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f2a4a">
<title>Inventar PDA</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --navy:#0f2a4a; --navy2:#173d6b; --bg:#f1f4f8; --card:#fff; --ink:#15202b; --muted:#5b6b7c; --line:#d8dfe8;
  --ok:#1b8a4c; --okbg:#e3f5ea; --warn:#c77700; --warnbg:#fff3df; --err:#c62828; --errbg:#fde8e8; --info:#1e63c7; --infobg:#e6eefb;
  --r:10px;
}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:var(--r);padding:12px 16px;background:var(--navy);color:#fff;font-weight:600;min-height:46px}
button.sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
button.ghost{background:transparent;color:var(--navy);border:0;padding:8px 10px;min-height:36px}
button.ok{background:var(--ok)} button.warn{background:var(--warn)} button.err{background:var(--err)}
button:disabled{opacity:.45;cursor:default}
button.big{font-size:18px;min-height:56px;width:100%}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;min-height:46px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--info);border-color:var(--info)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
h1,h2,h3{margin:0 0 8px} h2{font-size:20px} h3{font-size:16px}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .grow{flex:1} .right{margin-left:auto}
.card{background:var(--card);border-radius:12px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.06);margin-bottom:10px}
.hidden{display:none!important}
.topbar{background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.topbar .brand{font-weight:700;letter-spacing:.3px} .topbar .who{margin-left:auto;font-size:13px;opacity:.9}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;color:var(--muted);border-radius:0;border-bottom:3px solid transparent;padding:12px 14px;white-space:nowrap;min-height:44px}
.tabs button.on{color:var(--navy);border-bottom-color:var(--navy)}
.page{padding:12px;max-width:1100px;margin:0 auto}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)} .pill.err{background:var(--errbg);color:var(--err)} .pill.info{background:var(--infobg);color:var(--info)} .pill.grey{background:#e9edf2;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px} th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top} th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
tr.click{cursor:pointer} tr.click:hover{background:#f6f8fb}
.tablewrap{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px}
.kpi{background:#fff;border-radius:10px;padding:10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.06)} .kpi b{display:block;font-size:22px} .kpi span{font-size:12px;color:var(--muted)}
.bar{height:8px;background:#e5eaf0;border-radius:4px;overflow:hidden} .bar i{display:block;height:100%;background:var(--ok)}
/* banner feedback */
.banner{position:fixed;left:0;right:0;top:0;z-index:50;padding:16px 14px;font-size:18px;font-weight:700;color:#fff;text-align:center;transform:translateY(-110%);transition:transform .15s}
.banner.show{transform:none} .banner.ok{background:var(--ok)} .banner.warn{background:var(--warn)} .banner.err{background:var(--err)} .banner.info{background:var(--info)}
.banner small{display:block;font-weight:500;font-size:14px;opacity:.95}
/* PDA */
.pda .binbox{background:var(--navy);color:#fff;border-radius:12px;padding:12px;display:flex;align-items:center;gap:8px}
.pda .binbox .bin{font-size:34px;font-weight:800;letter-spacing:1px;flex:1;text-align:center;font-family:ui-monospace,Menlo,Consolas,monospace}
.pda .binbox button{background:rgba(255,255,255,.15);min-width:52px;padding:10px}
.pda .binbox .st{font-size:12px;opacity:.85;text-align:center}
.pda .scanin{font-size:18px;min-height:54px;border-width:2px;border-color:var(--navy)}
.line{background:#fff;border-radius:10px;padding:10px 12px;margin:8px 0;border-left:6px solid #c9d2dd;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.line.OK{border-left-color:var(--ok);background:var(--okbg)} .line.CANT{border-left-color:var(--warn);background:var(--warnbg)} .line.LOC{border-left-color:var(--info);background:var(--infobg)} .line.LIPSA{border-left-color:var(--err);background:var(--errbg)} .line.PLUS{border-left-color:#7b3fbf;background:#f1e8fb}
.line .mat{font-weight:800;font-size:18px;font-family:ui-monospace,Menlo,Consolas,monospace} .line .desc{font-size:13px;color:var(--muted)}
.line .qty{font-size:24px;font-weight:800;white-space:nowrap} .line .su{font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace}
.binlist .b{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border-radius:8px;margin:6px 0;cursor:pointer;border-left:5px solid #c9d2dd}
.binlist .b.done{border-left-color:var(--ok)} .binlist .b.closed{border-left-color:var(--err)} .binlist .b.cur{outline:2px solid var(--navy)}
.binlist .b .n{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:18px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,20,35,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px;max-height:92vh;overflow:auto}
@media(min-width:700px){.modal{align-items:center}.modal .box{border-radius:16px}}
.modal .x{float:right;font-size:22px;background:none;color:var(--muted);padding:0 8px;min-height:0}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px} .numpad button{min-height:52px;font-size:20px;background:#eef2f7;color:var(--ink)}
.chk{display:flex;align-items:center;gap:8px;padding:8px 0;font-weight:500} .chk input{width:auto;min-height:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px} @media(max-width:600px){.grid2{grid-template-columns:1fr}}
.login{max-width:420px;margin:40px auto;padding:16px}
.login .logo{font-size:28px;font-weight:800;color:var(--navy);margin-bottom:4px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#15202b;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1}
.offline{background:var(--warn);color:#fff;text-align:center;font-size:13px;padding:4px}
</style>
</head>
<body>
<div id="banner" class="banner"></div>
<div id="toast" class="toast"></div>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script type="module">
/* ============================ UTIL ============================ */
const CFG = window.INVENTAR_CONFIG || {demo:true};
const APP_VERSION = 'v2.3 · 19.10.2026';
const $ = (s, el=document)=>el.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = ()=>Date.now();
const fmtT = t => t? new Date(t).toLocaleString('ro-RO',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
const fmtF = t => t? new Date(t).toLocaleString('ro-RO',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '';
const fmtD = t => t? new Date(t).toLocaleDateString('ro-RO') : '';
const slugify = s => s.toLowerCase().trim().replace(/[ăâ]/g,'a').replace(/î/g,'i').replace(/ș|ş/g,'s').replace(/ț|ţ/g,'t').replace(/[^a-z0-9]+/g,'.').replace(/^\.|\.$/g,'');
const uid = ()=>Math.random().toString(36).slice(2,10)+now().toString(36);
let toastT; function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2500);}
let bannerT; function banner(kind,title,sub){const b=$('#banner');b.className='banner show '+kind;b.innerHTML=esc(title)+(sub?'<small>'+esc(sub)+'</small>':'');clearTimeout(bannerT);bannerT=setTimeout(()=>b.classList.remove('show'),kind==='ok'?1500:3500);}
let actx; function beep(kind){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const seq=kind==='ok'?[[880,.09]]:kind==='warn'?[[600,.12],[600,.12]]:[[200,.4]];let t=actx.currentTime;seq.forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.25,t);o.start(t);o.stop(t+d);t+=d+.06;});}catch(e){} try{navigator.vibrate&&navigator.vibrate(kind==='ok'?60:kind==='warn'?[80,60,80]:[300]);}catch(e){} }
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="box"><button class="x" data-close>✕</button>'+html+'</div>';m.querySelector('[data-close]').onclick=()=>m.remove();document.body.appendChild(m);return m;}
function confirmDlg(title,text,okLabel='Da',kind=''){return new Promise(res=>{const m=modal(`<h2>${esc(title)}</h2><p>${esc(text)}</p><div class="row"><button class="sec grow" data-no>Nu</button><button class="grow ${kind}" data-yes>${esc(okLabel)}</button></div>`);m.querySelector('[data-no]').onclick=()=>{m.remove();res(false)};m.querySelector('[data-yes]').onclick=()=>{m.remove();res(true)};m.querySelector('[data-close]').onclick=()=>{m.remove();res(false)};});}

/* ============================ STOCK MODEL ============================ */
// Zona unei locații: A-1-2-1 (etaj 1) -> "A-P" (A parter); A-1-2-3 (etaj 2+) -> "A-E" (A etaje);
// F7/F10/F20/F30 -> "F-BULK" (F bulk); YER / A-1-1 (staging) -> locația însăși (zonă specială)
function zoneOf(bin){ const b=String(bin).trim().toUpperCase(); const p=b.split('-'); if(p.length===4){ const et=parseInt(p[3],10); return p[0]+(et===1?'-P':'-E'); } if(/^F\d+$/.test(b)) return 'F-BULK'; return b; }
function zoneKind(z){ if(/-P$/.test(z)) return 'P'; if(/-E$/.test(z)) return 'E'; return 'S'; }
function zoneLabel(z){ if(z==='F-BULK') return 'F bulk'; const m=z.match(/^([A-Z]{1,2})-([PE])$/); if(m) return m[1]+(m[2]==='P'?' parter':' etaje'); return z; }
function isBulkZone(z){ return zoneKind(z)==='S'; }
const KIND_ORDER={P:0,E:1,S:2};
function cmpZone(a,b){ const ka=zoneKind(a),kb=zoneKind(b); if(ka!==kb) return KIND_ORDER[ka]-KIND_ORDER[kb]; return cmpBin(a,b); }
function binSortKey(bin){ const p=String(bin).split('-'); return [p[0], ...p.slice(1).map(x=>parseInt(x,10)||0)]; }
function cmpBin(a,b){ const ka=binSortKey(a), kb=binSortKey(b); for(let i=0;i<Math.max(ka.length,kb.length);i++){ if(ka[i]===undefined) return -1; if(kb[i]===undefined) return 1; if(ka[i]<kb[i]) return -1; if(ka[i]>kb[i]) return 1;} return 0; }
const COLS = ['Material','Plant','Storage Location','Batch','Material Description','Storage Type','Storage Bin','Available stock','Base Unit of Measure','GR Date','Storage Unit'];
function parseLX02(arrayBuffer){
  const wb = XLSX.read(arrayBuffer,{type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  let h=-1; for(let i=0;i<Math.min(rows.length,30);i++){ const r=rows[i].map(x=>String(x).trim()); if(r.includes('Storage Bin')&&r.includes('Material')){h=i;break;} }
  if(h<0) throw new Error('Nu găsesc antetul (coloanele "Material" și "Storage Bin") în fișier.');
  const hdr = rows[h].map(x=>String(x).trim()); const ix = n=>hdr.indexOf(n);
  const c = {m:ix('Material'),pl:ix('Plant'),sl:ix('Storage Location'),b:ix('Batch'),d:ix('Material Description'),st:ix('Storage Type'),bin:ix('Storage Bin'),q:ix('Available stock'),u:ix('Base Unit of Measure'),gr:ix('GR Date'),su:ix('Storage Unit')};
  if(c.q<0||c.su<0) throw new Error('Lipsesc coloanele "Available stock" sau "Storage Unit".');
  const lines=[]; let i=0;
  for(let r=h+1;r<rows.length;r++){ const row=rows[r]; const bin=String(row[c.bin]??'').trim(); const m=String(row[c.m]??'').trim(); if(!bin||!m) continue;
    const g = c.gr>=0? row[c.gr] : ''; let grs=String(g||''); if(typeof g==='number'){ const dt=XLSX.SSF.parse_date_code(g); grs=dt?`${String(dt.d).padStart(2,'0')}.${String(dt.m).padStart(2,'0')}.${dt.y}`:''; } else if(g instanceof Date){ grs=`${String(g.getDate()).padStart(2,'0')}.${String(g.getMonth()+1).padStart(2,'0')}.${g.getFullYear()}`; }
    let su = String(row[c.su]??'').trim(); if(/e\+/i.test(su)) su = Number(row[c.su]).toFixed(0);
    lines.push({i:i++, m, pl:String(row[c.pl]??''), sl:String(row[c.sl]??''), b:String(row[c.b]??''), d:String(row[c.d]??''), st:String(row[c.st]??''), bin, q:Number(row[c.q])||0, u:String(row[c.u]??''), gr:grs, su}); }
  return lines;
}
function lineKey(l){ return l.su ? l.su : 'L'+l.i; }
// status derivat: rec = înregistrarea scanată (din oricare zonă), closed = locația scriptică a fost închisă
function lineStatus(l, rec, closed){ if(rec){ if(rec.bin!==l.bin) return 'LOC'; if(Number(rec.q)!==Number(l.q)) return 'CANT'; return 'OK'; } return closed ? 'LIPSA' : 'NENUMARAT'; }
const STATUS_RO = {OK:'OK',CANT:'Cantitate diferită',LOC:'Altă locație',LIPSA:'Lipsă',NENUMARAT:'Nenumărat',PLUS:'În plus'};
const STATUS_KIND = {OK:'ok',CANT:'warn',LOC:'info',LIPSA:'err',NENUMARAT:'grey',PLUS:'info'};

/* ============================ STORE (demo local / Firebase) ============================ */
let Store;
function makeDemoStore(){
  const KEY='inventar_demo_v1'; let db; try{db=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
  if(!db) db={users:{},jobs:{},chunks:{},progress:{},setup:false};
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){toast('Memoria locală a browserului e plină (mod demo).');}};
  const listeners={jobs:[],progress:[]}; let cur=null; const authCbs=[];
  const emitJobs=()=>listeners.jobs.forEach(cb=>cb(Object.values(db.jobs)));
  const emitProg=(j,z)=>listeners.progress.forEach(l=>{ if(l.job===j && (!l.zone||l.zone===z)) l.cb(z, db.progress[j]?.[z]||{}); });
  const deepMerge=(a,b)=>{for(const k in b){ if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])){a[k]=a[k]||{};deepMerge(a[k],b[k]);} else a[k]=b[k];} return a;};
  return {
    demo:true,
    async init(){},
    onAuth(cb){authCbs.push(cb); cb(cur);},
    async isSetupDone(){return db.setup;},
    async setupAdmin(name,pin){const id=uid(); db.users[id]={id,name,slug:slugify(name),pin,role:'admin',active:true,created:now()}; db.setup=true; save(); cur=db.users[id]; authCbs.forEach(cb=>cb(cur));},
    async login(name,pin){const s=slugify(name); const u=Object.values(db.users).find(x=>x.slug===s); if(!u||u.pin!==pin) throw new Error('Nume sau PIN greșit.'); if(u.active===false) throw new Error('Utilizator dezactivat.'); cur=u; authCbs.forEach(cb=>cb(cur));},
    async logout(){cur=null; authCbs.forEach(cb=>cb(null));},
    async listUsers(){return Object.values(db.users);},
    async createUser(name,pin,role){const s=slugify(name); if(Object.values(db.users).some(x=>x.slug===s)) throw new Error('Există deja un utilizator cu acest nume.'); const id=uid(); db.users[id]={id,name,slug:s,pin,role,active:true,created:now()}; save();},
    async updateUser(id,data){Object.assign(db.users[id],data); save();},
    listenJobs(cb){listeners.jobs.push(cb); cb(Object.values(db.jobs)); return ()=>{listeners.jobs=listeners.jobs.filter(x=>x!==cb);};},
    async createJob(job,chunks){db.jobs[job.id]=job; db.chunks[job.id]=chunks; db.progress[job.id]={}; save(); emitJobs(); return job.id;},
    async updateJob(id,data){Object.assign(db.jobs[id],data); save(); emitJobs();},
    async deleteJob(id){delete db.jobs[id]; delete db.chunks[id]; delete db.progress[id]; save(); emitJobs();},
    async getChunks(jobId){return db.chunks[jobId]||{};},
    async getProgressAll(jobId){return JSON.parse(JSON.stringify(db.progress[jobId]||{}));},
    listenProgress(jobId,zone,cb){const l={job:jobId,zone,cb}; listeners.progress.push(l); const all=db.progress[jobId]||{}; if(zone) cb(zone,all[zone]||{}); else Object.keys(all).forEach(z=>cb(z,all[z])); return ()=>{listeners.progress=listeners.progress.filter(x=>x!==l);};},
    async mergeProgress(jobId,zone,obj){db.progress[jobId]=db.progress[jobId]||{}; db.progress[jobId][zone]=deepMerge(db.progress[jobId][zone]||{},JSON.parse(JSON.stringify(obj))); save(); emitProg(jobId,zone);},
    async deleteProgressField(jobId,zone,path){let o=db.progress[jobId]?.[zone]; for(let i=0;i<path.length-1;i++){o=o?.[path[i]];} if(o) delete o[path[path.length-1]]; save(); emitProg(jobId,zone);},
    resetDemo(){localStorage.removeItem(KEY); location.reload();}
  };
}
async function makeFirebaseStore(){
  const [{initializeApp},A,F] = await Promise.all([
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')]);
  const app=initializeApp(CFG.firebase); const auth=A.getAuth(app);
  let fs; try{ fs=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})}); }catch(e){ fs=F.getFirestore(app); }
  const email=s=>`${slugify(s)}@${CFG.authDomainSuffix||'inventar.local'}`;
  let cur=null; const authCbs=[]; let ready=false;
  const loadUser=async u=>{ if(!u) return null; const d=await F.getDoc(F.doc(fs,'users',u.uid)); if(!d.exists()) return {id:u.uid,name:u.email,role:'numarator',active:true,missing:true}; return {id:u.uid,...d.data()}; };
  A.onAuthStateChanged(auth, async u=>{ cur=await loadUser(u); ready=true; authCbs.forEach(cb=>cb(cur)); });
  const strip=o=>JSON.parse(JSON.stringify(o));
  return {
    demo:false,
    async init(){},
    onAuth(cb){authCbs.push(cb); if(ready) cb(cur);},
    async isSetupDone(){ const d=await F.getDoc(F.doc(fs,'config','locked')); return d.exists(); },
    async setupAdmin(name,pin){ const cred=await A.createUserWithEmailAndPassword(auth,email(name),pin); await F.setDoc(F.doc(fs,'users',cred.user.uid),{name,slug:slugify(name),role:'admin',active:true,created:now()}); await F.setDoc(F.doc(fs,'config','locked'),{at:now()}); cur=await loadUser(cred.user); authCbs.forEach(cb=>cb(cur)); },
    async login(name,pin){ try{ await A.signInWithEmailAndPassword(auth,email(name),pin);}catch(e){ throw new Error('Nume sau PIN greșit.'); } },
    async logout(){ await A.signOut(auth); },
    async listUsers(){ const s=await F.getDocs(F.collection(fs,'users')); return s.docs.map(d=>({id:d.id,...d.data()})); },
    async createUser(name,pin,role){ const sec=initializeApp(CFG.firebase,'sec'+uid()); const sa=A.getAuth(sec); let cred; try{ cred=await A.createUserWithEmailAndPassword(sa,email(name),pin);}catch(e){ throw new Error(e.code==='auth/email-already-in-use'?'Există deja un utilizator cu acest nume.':'Nu am putut crea utilizatorul: '+e.message); } await F.setDoc(F.doc(fs,'users',cred.user.uid),{name,slug:slugify(name),role,active:true,created:now()}); await A.signOut(sa); },
    async updateUser(id,data){ await F.updateDoc(F.doc(fs,'users',id),data); },
    listenJobs(cb){ return F.onSnapshot(F.collection(fs,'jobs'),s=>cb(s.docs.map(d=>({id:d.id,...d.data()})))); },
    async createJob(job,chunks){ const b=F.writeBatch(fs); b.set(F.doc(fs,'jobs',job.id),strip(job)); for(const z in chunks){ b.set(F.doc(fs,'jobs',job.id,'chunks',z),{lines:strip(chunks[z])}); } await b.commit(); return job.id; },
    async updateJob(id,data){ await F.updateDoc(F.doc(fs,'jobs',id),strip(data)); },
    async deleteJob(id){ const subs=['chunks','progress']; for(const sc of subs){ const snap=await F.getDocs(F.collection(fs,'jobs',id,sc)); let b=F.writeBatch(fs),n=0; for(const d of snap.docs){ b.delete(d.ref); if(++n===400){ await b.commit(); b=F.writeBatch(fs); n=0; } } if(n) await b.commit(); } await F.deleteDoc(F.doc(fs,'jobs',id)); },
    async getChunks(jobId){ const s=await F.getDocs(F.collection(fs,'jobs',jobId,'chunks')); const o={}; s.docs.forEach(d=>o[d.id]=d.data().lines||[]); return o; },
    async getProgressAll(jobId){ const s=await F.getDocs(F.collection(fs,'jobs',jobId,'progress')); const o={}; s.docs.forEach(d=>o[d.id]=d.data()); return o; },
    listenProgress(jobId,zone,cb){ if(zone) return F.onSnapshot(F.doc(fs,'jobs',jobId,'progress',zone),d=>cb(zone,d.exists()?d.data():{})); return F.onSnapshot(F.collection(fs,'jobs',jobId,'progress'),s=>s.docChanges().forEach(ch=>cb(ch.doc.id,ch.type==='removed'?{}:ch.doc.data()))); },
    async mergeProgress(jobId,zone,obj){ await F.setDoc(F.doc(fs,'jobs',jobId,'progress',zone),strip(obj),{merge:true}); },
    async deleteProgressField(jobId,zone,path){ await F.updateDoc(F.doc(fs,'jobs',jobId,'progress',zone),new F.FieldPath(...path),F.deleteField()); }
  };
}

/* ============================ PDA — NUMĂRARE ============================ */
// Numărătorul vede un singur inventar: toate zonele alocate lui, concatenate în ordine (parter → etaje → vrac)
function stopPda(){ (S.pda.unsubs||[]).forEach(u=>{ try{u();}catch(e){} }); S.pda.unsubs=[]; S.pda.route=false; }
// listă compactă de zone: A,B,C parter -> "A–C parter"
function zonesCompact(keys){ const parts=[]; for(const kind of ['P','E']){ const ls=keys.filter(k=>zoneKind(k)===kind).map(k=>k.split('-')[0]).sort(); if(!ls.length) continue; const rs=[]; let s=ls[0],p=ls[0]; for(let i=1;i<=ls.length;i++){ const c=ls[i]; if(c&&c.length===1&&p.length===1&&c.charCodeAt(0)===p.charCodeAt(0)+1){ p=c; continue; } rs.push(s===p?s:s+'–'+p); s=p=c; } parts.push(rs.join(', ')+(kind==='P'?' parter':' etaje')); } keys.filter(k=>zoneKind(k)==='S').sort(cmpZone).forEach(k=>parts.push(zoneLabel(k))); return parts.join(' · '); }
function renderPdaHome(){
  const p=$('#page'); const jobs=activeJobs().filter(j=>myZones(j).length);
  if(S.pda.job && jobs.some(j=>j.id===S.pda.job.id) && S.pda.route){ renderPdaCount(); return; }
  p.innerHTML=`<h2>Alege inventarul</h2>${jobs.length?'':'<div class="card muted">'+(isSup()?'Nu există joburi active.':'Nu ai nicio zonă alocată într-un inventar activ. Cere administratorului să-ți aloce zone.')+'</div>'}${jobs.map(j=>{const mz=myZones(j); const n=mz.reduce((a,z)=>a+z.n,0); return `<div class="card" style="cursor:pointer" data-job="${j.id}"><b>${esc(j.name)}</b><div class="small muted">${esc(zonesCompact(mz.map(z=>z.z)))}</div><div class="small muted">${n} paleți · creat ${fmtT(j.created)}</div></div>`;}).join('')}`;
  p.querySelectorAll('[data-job]').forEach(c=>c.onclick=()=>openPdaJob(S.jobs.find(j=>j.id===c.dataset.job)));
}
async function openPdaJob(job){
  const p=$('#page'); p.innerHTML='<div class="card">Se încarcă inventarul…</div>';
  stopPda(); const P=S.pda; P.job=job; P.strict=job.strict!==false; P.lastAction=null; P.binConfirmed=false;
  P.zones=myZones(job).map(z=>z.z).sort(cmpZone);
  if(!P.zones.length){ p.innerHTML='<div class="card muted">Nu ai zone alocate în acest inventar.</div><button class="sec" id="back">◀ Înapoi</button>'; $('#back').onclick=()=>{ P.job=null; renderPdaHome(); }; return; }
  P.chunks=await Store.getChunks(job.id); P.progAll=await Store.getProgressAll(job.id);
  P.suIndex={}; P.binIndex={}; for(const z in P.chunks){ P.chunks[z].forEach(l=>{ if(l.su) P.suIndex[l.su]={z,l}; (P.binIndex[l.bin]=P.binIndex[l.bin]||{z,lines:[]}).lines.push(l); }); }
  P.mats={}; for(const z in P.chunks) P.chunks[z].forEach(l=>{ if(!P.mats[l.m]) P.mats[l.m]={d:l.d,u:l.u}; });
  startRoute();
}
const zp=z=>S.pda.progAll[z]||{};
function zoneStats(z){ const P=S.pda; const lines=P.chunks[z]||[]; const pr=zp(z); const sc=pr.sc||{}; const n=lines.length; const done=lines.filter(l=>findRec(lineKey(l))).length; return {n,done,plus:Object.keys(pr.ex||{}).length}; }
function myStats(){ const P=S.pda; let n=0,done=0; P.zones.forEach(z=>{ const s=zoneStats(z); n+=s.n; done+=s.done; }); return {n,done}; }
function buildBins(){ const P=S.pda; const cur=P.bins?curBin():null; const out=[]; P.zones.forEach(z=>{ const set=new Set((P.chunks[z]||[]).map(l=>l.bin)); Object.keys(zp(z).nb||{}).forEach(b=>{ set.add(b); if(!P.binIndex[b]) P.binIndex[b]={z,lines:[],nb:true}; }); out.push(...[...set].sort(cmpBin)); }); if(P.reverse) out.reverse(); P.bins=out; if(cur){ const i=P.bins.indexOf(cur); if(i>=0) P.binIdx=i; } if(P.binIdx>=P.bins.length) P.binIdx=Math.max(0,P.bins.length-1); }
function startRoute(bin){
  const P=S.pda; stopPda(); P.route=true; P.bins=null; P.binIdx=0; buildBins();
  if(bin&&P.bins.includes(bin)){ P.binIdx=P.bins.indexOf(bin); P.binConfirmed=true; } else { const i=P.bins.findIndex(b=>!binDone(b)&&!binClosed(b)); if(i>=0) P.binIdx=i; }
  P.unsubs=P.zones.map(z=>Store.listenProgress(P.job.id,z,(zz,d)=>{ P.progAll[z]=d||{}; buildBins(); if(S.tab==='pda'&&P.route&&P.job) renderPdaCount(); }));
  renderPdaCount();
}
// înregistrarea scanată pentru o cheie (SU sau L<i>), din oricare zonă a jobului
function findRec(key){ const P=S.pda; for(const z in P.progAll){ const r=P.progAll[z]?.sc?.[key]; if(r) return {rec:r,z}; } return null; }
function binLines(bin){ return (S.pda.binIndex[bin]?.lines)||[]; }
function binZone(bin){ return S.pda.binIndex[bin]?.z; }
function curBin(){ return S.pda.bins[S.pda.binIdx]; }
function curZone(){ return binZone(curBin())||S.pda.zones[0]; }
const looksLikeBin=c=>/^[A-Z][A-Z0-9]{0,5}(-\d{1,3}){0,3}$/.test(c);

function gotoBin(i){ const P=S.pda; if(i<0||i>=P.bins.length){ toast(i<0?'Ești la prima locație':'Ești la ultima locație'); return; } P.binIdx=i; P.binConfirmed=!P.strict; renderPdaCount(); }

}

async function undoLast(){ const P=S.pda; const a=P.lastAction; if(!a) return; if(await confirmDlg('Anulezi ultima scanare?','','Anulează','warn')){ await Store.deleteProgressField(P.job.id,a.z||curZone(),[a.type,a.key]); P.lastAction=null; toast('Anulat'); } }
async function handleScan(raw){
  const P=S.pda; const code=raw.trim(); const up=code.toUpperCase();
  // 1) etichetă de locație?
  if(P.binIndex[up]){ const b=P.binIndex[up]; if(!P.zones.includes(b.z)){ beep('err'); banner('err','Locația '+up+' e în zona '+zlabel(P.job,b.z),'Zona nu îți este alocată'); return; } P.binIdx=P.bins.indexOf(up); P.binConfirmed=true; beep('ok'); renderPdaCount(); return; }
  // 2) număr de Storage Unit (14 cifre) — din codul 1D sau din QR
  const mm=code.match(/\d{14}/); const su=mm?mm[0]:null;
  if(!su){ if(looksLikeBin(up)){ const z=zoneOf(up); if(!P.zones.includes(z)&&P.job.zones.some(x=>x.z===z)){ beep('err'); banner('err','Locația '+up+' ar fi în zona '+zlabel(P.job,z),'Zona nu îți este alocată'); return; } beep('warn'); await addNewBin(up); return; } beep('err'); banner('err','Cod nerecunoscut',code.slice(0,40)); return; }
  if(P.strict&&!P.binConfirmed){ beep('err'); banner('err','Scanează mai întâi eticheta locației','Locația curentă: '+curBin()); return; }
  const bin=curBin(); const zone=curZone(); const hit=P.suIndex[su]; const prev=findRec(su);
  if(prev){ beep('err'); banner('err','Palet deja scanat','în '+prev.rec.bin+' de '+(prev.rec.u||'?')+' la '+fmtT(prev.rec.t)); return; }
  if(hit){ const l=hit.l;
    if(l.bin===bin){ await Store.mergeProgress(P.job.id,zone,{sc:{[su]:{q:l.q,bin,u:S.user.name,t:now(),m:l.m,d:l.d,home:l.bin}}}); P.lastAction={type:'sc',key:su,z:zone}; beep('ok'); banner('ok','✓ '+l.m+' · '+l.q+' '+l.u, l.d); if(binLines(bin).every(x=>x.su===su||findRec(lineKey(x)))) setTimeout(gotoNextOpen,900); return; }
    // palet găsit în altă locație decât cea scriptică
    await Store.mergeProgress(P.job.id,zone,{sc:{[su]:{q:l.q,bin,u:S.user.name,t:now(),m:l.m,d:l.d,home:l.bin}}}); P.lastAction={type:'sc',key:su,z:zone}; beep('warn'); banner('warn','Altă locație: scriptic în '+l.bin,l.m+' · '+l.q+' '+l.u+' · înregistrat în '+bin); return; }
  // 3) SU necunoscut în acest job
  beep('warn'); addExtraDialog(su,bin,zone);
}

function stopDash(){ if(S.dash.unsub){S.dash.unsub();S.dash.unsub=null;} }
const dayKey=t=>{ const d=new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
// joburile „din ziua” aleasă: create până în acea zi și încă active în acea zi (neînchise înainte de ea)
// joburile active într-un interval [from, to] (zile): create până la sfârșitul intervalului și neînchise înainte de început
function jobsInRange(from,to){ to=to||from; if(to<from) to=from; if(from>dayKey(now())) return []; const end=new Date(to+'T23:59:59').getTime(), start=new Date(from+'T00:00:00').getTime(); return S.jobs.filter(j=>j.status!=='sters'&&j.created<=end&&(j.status==='activ'||!j.closedAt||j.closedAt>=start)).sort((a,b)=>b.created-a.created); }

async function loadDash(){ stopDash(); const D=S.dash; $('#dbody').innerHTML='<div class="card">Se încarcă…</div>'; D.chunks=await Store.getChunks(D.job.id); D.users=(await Store.listUsers()).filter(u=>u.active!==false).sort((a,b)=>a.name.localeCompare(b.name)); D.prog={}; D.asgUser=D.asgUser||''; $('#dbody').innerHTML='<div id="asgbox"></div><div id="dstats"></div>'; D.unsub=Store.listenProgress(D.job.id,null,(z,d)=>{ D.prog[z]=d; if(S.tab==='dash'&&D.job) drawDash(); }); drawDash(); drawAssign(); }

function drawAssign(){ const D=S.dash; const box=$('#asgbox'); if(!box||!isAdmin()) return; const asg=D.job.assign||{}; const u=(D.users||[]).find(x=>x.id===D.asgUser);
  const free=D.job.zones.filter(z=>!asg[z.z]); const nAsg=D.job.zones.length-free.length;
  if(!D.asgOpen){ box.innerHTML=`<div class="card" style="padding:10px 14px"><div class="row"><b>Alocare zone pe numărători</b><span class="small muted">${nAsg} / ${D.job.zones.length} zone alocate${free.length?' · '+free.length+' nealocate':''}</span><button class="sec right" id="asgopen" style="min-height:36px;padding:6px 12px">Alocă zone ▾</button></div></div>`; $('#asgopen').onclick=()=>{ D.asgOpen=true; drawAssign(); }; return; }
  const group=(title,kind)=>{ const zs=free.filter(z=>zoneKind(z.z)===kind); if(!zs.length) return ''; return `<div class="small muted" style="margin:8px 0 2px"><b>${title}</b> · <a href="#" data-gsel="${kind}:1">toate</a> · <a href="#" data-gsel="${kind}:0">niciuna</a></div><div class="row" style="gap:4px 12px">${zs.map(z=>`<label class="chk" style="padding:4px 0;min-width:150px"><input type="checkbox" class="azone" data-kind="${kind}" value="${esc(z.z)}" ${u?'':'disabled'}> <span class="mono">${esc(z.label||zoneLabel(z.z))}</span></label>`).join('')}</div>`; };
  const byUser={}; D.job.zones.forEach(z=>{ const a=asg[z.z]; if(a){ (byUser[a.uid]=byUser[a.uid]||{name:a.name,zs:[]}).zs.push(z.z); } });
  box.innerHTML=`<div class="card"><div class="row"><h3 class="grow">Alocare zone pe numărători</h3><button class="ghost" id="asgclose">Închide ▴</button></div><div class="small muted">Alege numărătorul, bifează zonele (apar doar cele nealocate) și salvează. Numărătorul vede pe PDA un singur inventar cu toate zonele lui, în ordine.</div>
    <div class="row" style="margin-top:8px"><select id="asguser" style="width:auto;min-width:220px"><option value="">— alege numărătorul —</option>${(D.users||[]).map(x=>`<option value="${x.id}" ${x.id===D.asgUser?'selected':''}>${esc(x.name)} (${esc(x.role)})</option>`).join('')}</select><button id="asgsave" ${u?'':'disabled'}>Salvează alocarea</button><span class="small muted">${nAsg} / ${D.job.zones.length} zone alocate</span></div>
    ${free.length?group('Parter (etaj 1)','P')+group('Etaje (2+)','E')+group('Vrac / speciale','S'):'<div class="small muted" style="margin-top:8px">Toate zonele sunt alocate.</div>'}
    ${Object.keys(byUser).length?`<div class="small muted" style="margin:12px 0 4px"><b>Alocate</b> — ✕ scoate zona de la numărător</div>${Object.keys(byUser).sort((a,b)=>byUser[a].name.localeCompare(byUser[b].name)).map(uid=>`<div class="row small" style="margin:3px 0"><b style="min-width:120px">${esc(byUser[uid].name)}</b>${byUser[uid].zs.sort(cmpZone).map(z=>`<span class="pill info">${esc(zlabel(D.job,z))} <a href="#" data-unz="${esc(z)}" style="color:inherit;text-decoration:none;margin-left:3px">✕</a></span>`).join(' ')}</div>`).join('')}`:''}</div>`;
  $('#asguser').onchange=e=>{ D.asgUser=e.target.value; drawAssign(); }; $('#asgclose').onclick=()=>{ D.asgOpen=false; drawAssign(); };
  box.querySelectorAll('[data-gsel]').forEach(a=>a.onclick=e=>{ e.preventDefault(); if(!u) return; const [k,v]=a.dataset.gsel.split(':'); box.querySelectorAll('.azone[data-kind="'+k+'"]').forEach(c=>c.checked=v==='1'); });
  box.querySelectorAll('[data-unz]').forEach(a=>a.onclick=async e=>{ e.preventDefault(); const assign={...asg}; delete assign[a.dataset.unz]; await Store.updateJob(D.job.id,{assign}); D.job.assign=assign; drawAssign(); drawDash(); });
  $('#asgsave').onclick=async()=>{ if(!u) return; const assign={...asg}; let k=0; box.querySelectorAll('.azone:checked').forEach(c=>{ assign[c.value]={uid:u.id,name:u.name}; k++; }); if(!k){ toast('Bifează cel puțin o zonă.'); return; } $('#asgsave').disabled=true; await Store.updateJob(D.job.id,{assign}); D.job.assign=assign; toast(k+' zone alocate la '+u.name); drawAssign(); drawDash(); }; }
// analiza completă a jobului: fiecare linie scriptică + extras, cu status
function analyze(chunks,prog){ const scAll={}; for(const z in prog){ const sc=prog[z]?.sc||{}; for(const k in sc) scAll[k]={...sc[k],z}; } const clAll={}; for(const z in prog){ const cl=prog[z]?.cl||{}; for(const b in cl) clAll[b]=cl[b]; }
  const rows=[]; for(const z in chunks){ chunks[z].forEach(l=>{ const rec=scAll[lineKey(l)]; const st=lineStatus(l,rec,!!clAll[l.bin]); rows.push({z,l,rec,st,fiz:rec?Number(rec.q):(st==='LIPSA'?0:null),dif:rec?Number(rec.q)-Number(l.q):(st==='LIPSA'?-Number(l.q):null)}); }); }
  const extras=[]; for(const z in prog){ const ex=prog[z]?.ex||{}; for(const id in ex) extras.push({z,id,e:ex[id]}); }
  return {rows,extras,clAll}; }
function drawDash(){ const D=S.dash; const {rows,extras}=analyze(D.chunks,D.prog); const cnt=s=>rows.filter(r=>r.st===s).length; const scanned=rows.filter(r=>r.rec).length; const pct=rows.length?Math.round(100*scanned/rows.length):0;
  const byZone={}; rows.forEach(r=>{ const o=byZone[r.z]=byZone[r.z]||{n:0,sc:0,ok:0,cant:0,loc:0,lipsa:0,plus:0}; o.n++; if(r.rec)o.sc++; if(r.st==='OK')o.ok++; if(r.st==='CANT')o.cant++; if(r.st==='LOC')o.loc++; if(r.st==='LIPSA')o.lipsa++; }); extras.forEach(x=>{ (byZone[x.z]=byZone[x.z]||{n:0,sc:0,ok:0,cant:0,loc:0,lipsa:0,plus:0}).plus++; });
  const byUser={}; rows.forEach(r=>{ if(r.rec?.u){ const o=byUser[r.rec.u]=byUser[r.rec.u]||{n:0,last:0}; o.n++; o.last=Math.max(o.last,r.rec.t||0);} }); extras.forEach(x=>{ if(x.e.u){ const o=byUser[x.e.u]=byUser[x.e.u]||{n:0,last:0}; o.n++; o.last=Math.max(o.last,x.e.t||0);} });
  const asgD=D.job.assign||{}; const byOwner={}; D.job.zones.forEach(zz=>{ const z=zz.z; const a=asgD[z]; const k=a?a.uid:'~'; const o=byOwner[k]=byOwner[k]||{name:a?a.name:'— nealocate —',zs:[],n:0,sc:0,ok:0,cant:0,loc:0,lipsa:0,plus:0}; o.zs.push(z); const b=byZone[z]; if(b){ o.n+=b.n; o.sc+=b.sc; o.ok+=b.ok; o.cant+=b.cant; o.loc+=b.loc; o.lipsa+=b.lipsa; o.plus+=b.plus; } });
  const diffs=rows.filter(r=>['CANT','LOC','LIPSA'].includes(r.st)).length+extras.length;
  $('#dstats').innerHTML=`<div class="kpis"><div class="kpi"><b>${pct}%</b><span>progres · ${scanned}/${rows.length} paleți</span></div><div class="kpi"><b style="color:var(--ok)">${cnt('OK')}</b><span>OK</span></div><div class="kpi"><b style="color:var(--warn)">${cnt('CANT')}</b><span>cantitate diferită</span></div><div class="kpi"><b style="color:var(--info)">${cnt('LOC')}</b><span>altă locație</span></div><div class="kpi"><b style="color:var(--err)">${cnt('LIPSA')}</b><span>lipsă</span></div><div class="kpi"><b style="color:#7b3fbf">${extras.length}</b><span>în plus</span></div><div class="kpi"><b>${cnt('NENUMARAT')}</b><span>nenumărat</span></div></div>
  <div class="row" style="margin-bottom:10px"><button id="xls">⬇ Export Excel (scriptic vs fizic)</button>${isAdmin()&&diffs?`<button class="sec" id="recount">Job de reverificare (${diffs} diferențe)</button>`:''}</div>
  <div class="card tablewrap"><h3>Pe numărători</h3><table><thead><tr><th>Numărător</th><th>Zone</th><th>Paleți</th><th>Scanați</th><th>Progres</th><th>OK</th><th>Cant.</th><th>Altă loc.</th><th>Lipsă</th><th>În plus</th><th>Ultima scanare</th></tr></thead><tbody>${Object.keys(byOwner).sort((a,b)=>a==='~'?1:b==='~'?-1:byOwner[a].name.localeCompare(byOwner[b].name)).map(k=>{const o=byOwner[k];const p=o.n?Math.round(100*o.sc/o.n):0;const bu=byUser[o.name]||{};return `<tr><td><b>${esc(o.name)}</b></td><td class="small">${esc(zonesCompact(o.zs))}</td><td>${o.n}</td><td>${o.sc}</td><td style="min-width:120px"><div class="bar"><i style="width:${p}%"></i></div><span class="small muted">${p}%</span></td><td>${o.ok}</td><td>${o.cant||''}</td><td>${o.loc||''}</td><td>${o.lipsa||''}</td><td>${o.plus||''}</td><td class="small">${fmtT(bu.last)||''}</td></tr>`;}).join('')}</tbody></table>
   <div class="small" style="margin-top:8px"><a href="#" id="zdet">${D.zoneDetail?'Ascunde detaliul pe zone ▴':'Detaliu pe zone ▾'}</a></div>
   ${D.zoneDetail?`<table style="margin-top:6px"><thead><tr><th>Zonă</th><th>Alocat la</th><th>Paleți</th><th>Scanați</th><th>Progres</th><th>OK</th><th>Cant.</th><th>Altă loc.</th><th>Lipsă</th><th>În plus</th></tr></thead><tbody>${Object.keys(byZone).sort(cmpZone).map(z=>{const o=byZone[z];const p=o.n?Math.round(100*o.sc/o.n):0;return `<tr><td class="mono"><b>${esc(zlabel(D.job,z))}</b></td><td>${esc((D.job.assign||{})[z]?.name||'—')}</td><td>${o.n}</td><td>${o.sc}</td><td style="min-width:120px"><div class="bar"><i style="width:${p}%"></i></div><span class="small muted">${p}%</span></td><td>${o.ok}</td><td>${o.cant||''}</td><td>${o.loc||''}</td><td>${o.lipsa||''}</td><td>${o.plus||''}</td></tr>`;}).join('')}</tbody></table>`:''}</div>
  <div class="card tablewrap"><h3>Ultimele diferențe</h3><table><thead><tr><th>Status</th><th>Articol</th><th>Locație</th><th>Scriptic</th><th>Fizic</th><th>Cine</th></tr></thead><tbody>${[...rows.filter(r=>['CANT','LOC','LIPSA'].includes(r.st)).map(r=>({st:r.st,m:r.l.m,bin:r.l.bin+(r.rec&&r.rec.bin!==r.l.bin?' → '+r.rec.bin:''),s:r.l.q,f:r.fiz,u:r.rec?.u||'',t:r.rec?.t||0})),...extras.map(x=>({st:'PLUS',m:x.e.m,bin:x.e.bin,s:'',f:x.e.q,u:x.e.u,t:x.e.t}))].sort((a,b)=>b.t-a.t).slice(0,40).map(r=>`<tr><td><span class="pill ${STATUS_KIND[r.st]}">${STATUS_RO[r.st]}</span></td><td class="mono">${esc(r.m)}</td><td class="mono">${esc(r.bin)}</td><td>${esc(r.s)}</td><td>${esc(r.f)}</td><td class="small">${esc(r.u)}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">Nicio diferență</td></tr>'}</tbody></table></div>`;
  const zd=$('#zdet'); if(zd) zd.onclick=e=>{ e.preventDefault(); D.zoneDetail=!D.zoneDetail; drawDash(); };
  $('#xls').onclick=()=>exportExcel([{job:D.job,chunks:D.chunks,prog:D.prog}]); const rc=$('#recount'); if(rc) rc.onclick=()=>createRecount(D.job,D.chunks,D.prog);

}
// Export Excel: unul sau mai multe joburi (zi / perioadă) în același workbook, cu coloana "Inventar" + sumar pe joburi
function exportExcel(items,fname){ if(!Array.isArray(items)) items=[items]; const multi=items.length>1;
  const H=['Inventar',...COLS,'Fizic','Diferență','Status','Locație fizică','Scanat de','Data/ora','Observații'];
  const all=[H], dif=[H], jur=[['Inventar','Data/ora','Utilizator','Tip','SU','Articol','Locație','Cantitate']];
  const sumZ=[['Inventar','Zonă','Alocat la','Paleți scriptic','Scanați','OK','Cantitate diferită','Altă locație','Lipsă','Nenumărat','În plus','Buc. scriptic','Buc. fizic','Diferență buc.']];
  const sumJ=[['Inventar','Creat','Status','Paleți scriptic','Scanați','Progres %','OK','Cantitate diferită','Altă locație','Lipsă','Nenumărat','În plus','Buc. scriptic','Buc. fizic','Diferență buc.']];
  const sumU={}; const tot={n:0,sc:0,ok:0,cant:0,loc:0,lipsa:0,nen:0,plus:0,sq:0,fq:0};
  const acc=(o,r)=>{ o.n++; o.sq+=Number(r.l.q); if(r.rec){o.sc++;o.fq+=Number(r.rec.q);} o[{OK:'ok',CANT:'cant',LOC:'loc',LIPSA:'lipsa',NENUMARAT:'nen'}[r.st]]++; };
  const blank=()=>({n:0,sc:0,ok:0,cant:0,loc:0,lipsa:0,nen:0,plus:0,sq:0,fq:0});
  items.forEach(({job,chunks,prog})=>{ const {rows,extras,clAll}=analyze(chunks,prog); const J=job.name;
    const rowOf=r=>{const l=r.l,rec=r.rec; return [J,l.m,l.pl,l.sl,l.b,l.d,l.st,l.bin,l.q,l.u,l.gr,l.su,r.fiz??'',r.dif??'',STATUS_RO[r.st],rec?rec.bin:'',rec?.u||(r.st==='LIPSA'?(clAll[l.bin]?.u||''):''),rec?fmtF(rec.t):(r.st==='LIPSA'?fmtF(clAll[l.bin]?.t):''),(rec?.man?'cantitate introdusă manual':'')+(r.st==='LOC'?' scriptic '+l.bin+' / fizic '+rec.bin:'')+(r.st==='LIPSA'&&clAll[l.bin]?.e?' locație raportată goală':'')]; };
    const knownBins=new Set(); for(const z in chunks) chunks[z].forEach(l=>knownBins.add(l.bin));
    const exOf=x=>[J,x.e.m,'','',x.e.b||'',x.e.d||'','',x.e.bin,0,x.e.uom||'','',x.e.su||'',x.e.q,x.e.q,STATUS_RO.PLUS,x.e.bin,x.e.u||'',fmtF(x.e.t),'palet adăugat manual la scanare'+(knownBins.has(x.e.bin)?'':' · locație nouă (nu era în export)')];
    rows.sort((a,b)=>cmpBin(a.l.bin,b.l.bin)); all.push(...rows.map(rowOf),...extras.map(exOf)); dif.push(...rows.filter(r=>['CANT','LOC','LIPSA'].includes(r.st)).map(rowOf),...extras.map(exOf));
    const byZone={}; const jt=blank(); rows.forEach(r=>{ acc(byZone[r.z]=byZone[r.z]||blank(),r); acc(jt,r); acc(tot,r); const u=r.rec?.u; if(u){ const o=sumU[u]=sumU[u]||{...blank(),last:0}; acc(o,r); o.last=Math.max(o.last,r.rec.t||0);} });
    extras.forEach(x=>{ (byZone[x.z]=byZone[x.z]||blank()).plus++; byZone[x.z].fq+=Number(x.e.q); jt.plus++; jt.fq+=Number(x.e.q); tot.plus++; tot.fq+=Number(x.e.q); if(x.e.u){ const o=sumU[x.e.u]=sumU[x.e.u]||{...blank(),last:0}; o.plus++; o.fq+=Number(x.e.q); o.last=Math.max(o.last,x.e.t||0);} });
    Object.keys(byZone).sort(cmpZone).forEach(z=>{const o=byZone[z]; sumZ.push([J,zlabel(job,z),(job.assign||{})[z]?.name||'',o.n,o.sc,o.ok,o.cant,o.loc,o.lipsa,o.nen,o.plus,o.sq,o.fq,o.fq-o.sq]);});
    sumJ.push([J,fmtF(job.created),job.status,jt.n,jt.sc,jt.n?Math.round(100*jt.sc/jt.n):0,jt.ok,jt.cant,jt.loc,jt.lipsa,jt.nen,jt.plus,jt.sq,jt.fq,jt.fq-jt.sq]);
    [...rows.filter(r=>r.rec).map(r=>[r.rec.t,J,r.rec.u,STATUS_RO[r.st],r.l.su,r.l.m,r.rec.bin,r.rec.q]),...extras.map(x=>[x.e.t,J,x.e.u,'În plus',x.e.su,x.e.m,x.e.bin,x.e.q])].sort((a,b)=>a[0]-b[0]).forEach(r=>jur.push([r[1],fmtF(r[0]),...r.slice(2)])); });
  sumJ.push(['TOTAL','','',tot.n,tot.sc,tot.n?Math.round(100*tot.sc/tot.n):0,tot.ok,tot.cant,tot.loc,tot.lipsa,tot.nen,tot.plus,tot.sq,tot.fq,tot.fq-tot.sq]);
  const sumUsers=[['Numărător','Paleți scanați','OK','Cantitate diferită','Altă locație','În plus','Buc. fizic','Ultima scanare'],...Object.keys(sumU).sort().map(u=>{const o=sumU[u];return [u,o.sc,o.ok,o.cant,o.loc,o.plus,o.fq,fmtF(o.last)];})];
  const wb=XLSX.utils.book_new(); const add=(name,data,widths)=>{ const ws=XLSX.utils.aoa_to_sheet(data); ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(1,data.length-1),c:data[0].length-1}})}; ws['!cols']=(widths||data[0].map(()=>({wch:14}))); ws['!freeze']={xSplit:0,ySplit:1}; XLSX.utils.book_append_sheet(wb,ws,name); };
  const w=[22,16,7,8,12,34,8,10,10,6,11,16,8,10,16,12,14,16,30].map(x=>({wch:x}));
  add('Sumar inventare',sumJ,[22,16,8,12,9,9,8,12,10,8,10,8,12,10,12].map(x=>({wch:x}))); add('Scriptic vs Fizic',all,w); add('Diferente',dif,w); add('Sumar zone',sumZ); add('Sumar numaratori',sumUsers); add('Jurnal scanari',jur);
  XLSX.writeFile(wb,(fname||`Inventar_${slugify(items[0].job.name)}`)+`_${new Date().toISOString().slice(0,10)}.xlsx`); }
// export consolidat pe o zi sau o perioadă: toate joburile active în interval
async function exportPeriod(from,to){ const jobs=jobsInRange(from,to); if(!jobs.length){ toast('Niciun inventar în perioada aleasă.'); return; }
  const btn=$('#pxls'); if(btn){ btn.disabled=true; btn.textContent='Se pregătește…'; }
  try{ const items=[]; for(const job of jobs){ const chunks=await Store.getChunks(job.id); const prog=await Store.getProgressAll(job.id); items.push({job,chunks,prog}); } exportExcel(items,'Inventar_'+from+(to&&to!==from?'_'+to:'')); }
  catch(e){ toast('Eroare la export: '+e.message); } finally{ if(btn){ btn.disabled=false; btn.textContent='⬇ Export Excel perioadă ('+jobs.length+')'; } } }
async function createRecount(job,chunks,prog){ const {rows,extras}=analyze(chunks,prog); const pick=rows.filter(r=>['CANT','LOC','LIPSA'].includes(r.st)); if(!pick.length&&!extras.length){toast('Nu sunt diferențe.');return;}
  if(!await confirmDlg('Creezi jobul de reverificare?',pick.length+' linii cu diferențe + '+extras.length+' paleți în plus. Locațiile folosite: cea scriptică (pentru lipsă/cantitate) sau cea fizică (altă locație / în plus).','Creează')) return;
  const lines=[]; let i=0; pick.forEach(r=>{ const l={...r.l,i:i++}; if(r.st==='LOC') l.bin=r.rec.bin; lines.push(l); }); extras.forEach(x=>lines.push({i:i++,m:x.e.m,pl:'',sl:'',b:x.e.b||'',d:x.e.d||'',st:'',bin:x.e.bin,q:Number(x.e.q),u:x.e.uom||'',gr:'',su:x.e.su||''}));
  const ch={}; lines.forEach(l=>{ const z=zoneOf(l.bin); (ch[z]=ch[z]||[]).push(l); });
  const nj={id:uid(),name:'Reverificare – '+job.name,created:now(),createdBy:S.user.name,status:'activ',source:job.name,parent:job.id,totalLines:lines.length,strict:job.strict!==false,zones:Object.keys(ch).sort(cmpZone).map(z=>({z,label:zoneLabel(z),n:ch[z].length,bins:new Set(ch[z].map(l=>l.bin)).size,bulk:isBulkZone(z)})),assign:{}};
  await Store.createJob(nj,ch); toast('Job de reverificare creat'); }

/* ============================ BOOT ============================ */
(async function boot(){
  try{ Store = CFG.demo ? makeDemoStore() : await makeFirebaseStore(); }catch(e){ app.innerHTML='<div class="login card">Nu pot porni Firebase: '+esc(e.message)+'<br>Verifică config.js.</div>'; return; }
  await Store.init();
  if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
  Store.onAuth(async u=>{ S.user=u; if(S.unsubJobs){S.unsubJobs();S.unsubJobs=null;} stopPda(); stopDash(); S.pda.job=null; S.pda.route=false; S.dash.job=null; S.tab=null;
    if(!u){ const done=await Store.isSetupDone(); renderLogin(!done); return; }
    if(u.missing){ app.innerHTML='<div class="login card">Contul există în Firebase Auth dar nu are fișă de utilizator (users/'+esc(u.id)+'). Roagă administratorul să o creeze.<br><br><button id="lo">Ieși</button></div>'; $('#lo').onclick=()=>Store.logout(); return; }
    if(u.active===false){ app.innerHTML='<div class="login card">Utilizator dezactivat.<br><br><button id="lo">Ieși</button></div>'; $('#lo').onclick=()=>Store.logout(); return; }
    S.unsubJobs=Store.listenJobs(jobs=>{ S.jobs=jobs; if(S.dash.job){ const j=jobs.find(x=>x.id===S.dash.job.id); if(j) S.dash.job=j; } if(S.pda.job){ const j=jobs.find(x=>x.id===S.pda.job.id); if(j) S.pda.job=j; } if(S.tab==='jobs') renderJobs(); else if(S.tab==='pda'&&!S.pda.route) renderPdaHome(); else if(S.tab==='dash'&&!S.dash.job) renderDashHome(); else if(S.tab==='dash'&&S.dash.job&&!jobs.some(j=>j.id===S.dash.job.id&&j.status!=='sters')){ stopDash(); S.dash.job=null; renderDashHome(); } });
    renderShell(); });
})();
